<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TruthNewsApp — Loading</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05090c; font-family: "Segoe UI", sans-serif; }
      body { border: 1px solid rgba(244, 190, 73, .72); border-radius: 24px; }
      .splash-screen { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 23px; background: #05090c; }
      .splash-screen img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .splash-status { position: absolute; left: 0; right: 0; bottom: 0; padding: 34px 42px 24px; background: linear-gradient(transparent, rgba(3, 6, 8, .9)); color: #f4be49; text-align: center; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; text-shadow: 0 2px 8px #000; }
      .splash-track { height: 2px; margin-top: 12px; overflow: hidden; border-radius: 2px; background: rgba(255, 255, 255, .16); }
      .splash-progress { width: 42%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, transparent, #f4be49, transparent); animation: load 1.35s ease-in-out infinite; }
      @keyframes load { from { transform: translateX(-110%); } to { transform: translateX(340%); } }
      @media (prefers-reduced-motion: reduce) { .splash-progress { width: 100%; opacity: .65; animation: none; } }
    </style>
  </head>
  <body>
    <main class="splash-screen">
      <img src="./logo-splash.png" alt="TruthNewsApp">
      <div class="splash-status">
        Preparing Scripture, history, prophecy, and news
        <div class="splash-track"><div class="splash-progress"></div></div>
      </div>
    </main>
  </body>
</html>
